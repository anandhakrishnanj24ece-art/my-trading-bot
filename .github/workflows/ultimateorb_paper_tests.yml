name: UltimateORB paper tests

on:
  push:
    paths:
      - "ultimateorb_paper/**"
      - ".github/workflows/ultimateorb_paper_tests.yml"
  pull_request:
    paths:
      - "ultimateorb_paper/**"
      - ".github/workflows/ultimateorb_paper_tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run paper-only tests
        run: python -m unittest discover -s ultimateorb_paper/tests -v
