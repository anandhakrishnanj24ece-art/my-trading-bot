name: FVG Duo paper tests

on:
  push:
    paths:
      - "fvg_duo_paper/**"
      - ".github/workflows/fvg_duo_paper_tests.yml"
      - "requirements.txt"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: |
          export PYTHONPATH=$(pwd)
          python -m unittest discover -s fvg_duo_paper/tests -t . -v
