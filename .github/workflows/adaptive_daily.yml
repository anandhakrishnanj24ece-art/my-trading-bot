name: Daily Adaptive Strategies & Dashboard

on:
  schedule:
    - cron: '0 1 * * *' # Daily at 01:00 UTC, after the crypto daily candle closes (00:00 UTC)
  workflow_dispatch: # Manual trigger

permissions:
  contents: write

jobs:
  adaptive-daily:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Adaptive Weighted Strategy
        run: |
          cd nosharashi_1
          export PYTHONPATH=$(pwd)
          python neural_flow/run_adaptive.py

      - name: Run Adaptive v3 Strategy
        run: |
          cd nosharashi_1
          export PYTHONPATH=$(pwd)
          python neural_flow/run_adaptive_v3.py

      - name: Run TrendVol Strategy
        continue-on-error: true
        run: |
          cd nosharashi_1
          export PYTHONPATH=$(pwd)
          python neural_flow/run_trend.py

      - name: Generate Live Dashboard Feed & Update Docs
        run: |
          cd nosharashi_1
          python -c "
          import json, datetime
          try:
              with open('paper_state_adaptive.json') as f: s1 = json.load(f)
          except: s1 = {}
          try:
              with open('paper_state_v3.json') as f: s2 = json.load(f)
          except: s2 = {}
          try:
              with open('../paper_state.json') as f: s3 = json.load(f)
          except: s3 = {}
          try:
              with open('paper_state_trend.json') as f: s4 = json.load(f)
          except: s4 = {}
          feed = {
              'updated_at': datetime.datetime.now(datetime.timezone.utc).strftime('%Y-%m-%d %H:%M:%S UTC'),
              'updated_at_ist': datetime.datetime.now(datetime.timezone(datetime.timedelta(hours=5, minutes=30))).strftime('%d %b %Y, %I:%M:%S %p IST'),
              'adaptive': s1,
              'v3': s2,
              'amd': s3,
              'trend': s4,
              'history_adaptive': s1.get('trade_history', []),
              'history_v3': s2.get('trade_history', []),
              'history_trend': s4.get('trade_history', [])
          }
          with open('../dashboard_data.json', 'w') as f:
              json.dump(feed, f, indent=2)
          "
          python update_history_md.py

      - name: Commit & Push Balance Updates
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p nosharashi_1/price_snapshots
          git add nosharashi_1/paper_balance*.txt nosharashi_1/paper_state*.json nosharashi_1/price_snapshots paper_state.json equity_history.json dashboard_data.json index.html TRADE_HISTORY.md
          git commit -m "Auto-update adaptive paper trading balances and dashboard [skip ci]" || echo "No balance change to commit"
          git push
