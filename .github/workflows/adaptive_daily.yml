name: Daily Adaptive Strategies & Dashboard

on:
  schedule:
    - cron: '0 1 * * *' # Daily at 01:00 UTC, after the crypto daily candle closes (00:00 UTC)
  workflow_dispatch: # Manual trigger

permissions:
  contents: write

# Serialize with the AMD workflow so the two bots never race on git state.
concurrency:
  group: paper-trading-state
  cancel-in-progress: false

jobs:
  adaptive-daily:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run regression tests
        run: python -m unittest discover -s tests -v

      - name: Run Adaptive Weighted Strategy
        run: |
          cd nosharashi_1
          export PYTHONPATH=$(pwd)
          python neural_flow/run_adaptive.py

      - name: Run Adaptive v3 Strategy
        run: |
          cd nosharashi_1
          export PYTHONPATH=$(pwd)
          python neural_flow/run_adaptive_v3.py

      - name: Run TrendVol Strategy
        run: |
          cd nosharashi_1
          export PYTHONPATH=$(pwd)
          python neural_flow/run_trend.py

      - name: Generate Live Dashboard Feed & Update Docs
        run: |
          python build_dashboard.py
          python nosharashi_1/update_history_md.py

      - name: Commit & Push Balance Updates
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          mkdir -p nosharashi_1/price_snapshots
          git add nosharashi_1/paper_balance*.txt nosharashi_1/paper_state*.json nosharashi_1/price_snapshots paper_state.json equity_history.json dashboard_data.json TRADE_HISTORY.md
          git commit -m "Auto-update adaptive paper trading balances and dashboard [skip ci]" || echo "No balance change to commit"
          git pull --rebase --autostash origin main
          git push
