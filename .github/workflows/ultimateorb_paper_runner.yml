name: UltimateORB paper session runner

on:
  # 13:55 UTC = 08:55 CDT; 14:55 UTC = 08:55 CST.
  # Each job loops every 6 minutes until the paper session closes.
  schedule:
    - cron: '55 13 * * 1-5'
    - cron: '55 14 * * 1-5'
  push:
    paths:
      - "ultimateorb_paper/**"
      - ".github/workflows/ultimateorb_paper_runner.yml"
      - "requirements.txt"
  workflow_dispatch:

permissions:
  contents: write

# One session loop at a time. A second scheduled/DST run waits, then exits.
concurrency:
  group: ultimateorb-paper-loop
  cancel-in-progress: false

jobs:
  paper-session:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run paper session loop
        run: |
          set -u
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          export PYTHONPATH=$(pwd)

          while true; do
            set +e
            python -m ultimateorb_paper.session_tick
            status=$?
            set -e

            git add -f ultimateorb_paper/state
            git commit -m "Auto-update UltimateORB paper state [skip ci]" || true
            git pull --rebase --autostash origin main || true
            git push || true

            if [ "$status" -ne 0 ]; then
              break
            fi
            sleep 360
          done
