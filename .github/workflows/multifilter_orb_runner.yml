name: Multi-Filter ORB Paper Runner

on:
  schedule:
    - cron: '*/6 * * * *' # Every 6 minutes during US session
  push:
    paths:
      - "multifilter_orb_paper/**"
      - ".github/workflows/multifilter_orb_runner.yml"
      - "requirements.txt"
  workflow_dispatch:

permissions:
  contents: write

# Serialize with other paper workflows so state commits never race.
concurrency:
  group: paper-trading-state
  cancel-in-progress: false

jobs:
  multifilter-orb-runner:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Multi-Filter ORB paper tick
        run: |
          export PYTHONPATH=$(pwd)
          python -m multifilter_orb_paper.runner

      - name: Commit & push paper state
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -f multifilter_orb_paper/state
          git commit -m "Auto-update Multi-Filter ORB paper state [skip ci]" || echo "No Multi-Filter ORB change to commit"
          git pull --rebase --autostash origin main
          git push
