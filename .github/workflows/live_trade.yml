name: AMD Intraday Paper Trader

on:
  schedule:
    - cron: '*/6 * * * *' # Intraday AMD bot only; daily adaptive runs in adaptive_daily.yml
  workflow_dispatch: # Manual trigger

permissions:
  contents: write

jobs:
  amd-intraday:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run AMD Smart Money Futures Paper Trader
        run: |
          export PYTHONPATH=$(pwd)
          python amd_paper_trader.py --live --capital 10000 --symbols BTC-USD ETH-USD SOL-USD BNB-USD XRP-USD

      - name: Commit & Push AMD state
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add paper_state.json equity_history.json
          git commit -m "Auto-update AMD paper state [skip ci]" || echo "No AMD change to commit"
          git push
